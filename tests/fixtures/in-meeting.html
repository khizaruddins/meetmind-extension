<!DOCTYPE html>
<html>
<head>
  <title>Architecture Review - Google Meet</title>
</head>
<body>
  <div class="meeting-stage" data-meeting-title="Architecture Review">
    <div class="video-grid">
      <div class="participant">Speaker</div>
    </div>
    <div role="region" aria-label="Meeting controls" class="bottom-bar">
      <button aria-label="Turn off microphone (ctrl + d)">Mic</button>
      <button aria-label="Turn off camera (ctrl + e)">Cam</button>
      <button aria-label="Raise hand">Hand</button>
      <button aria-label="Present now">Present</button>
      <button aria-label="Leave call" data-tooltip="Leave call">
        <i class="material-icons">call_end</i>
      </button>
    </div>
  </div>
</body>
</html>
